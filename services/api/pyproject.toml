[project]
name = "suraksha-api"
version = "0.1.0"
description = "Suraksha community scam aggregation reports API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[tool.vercel]
entrypoint = "main:app"
